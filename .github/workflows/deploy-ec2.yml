# Push to main -> deploy to EC2 automatically. No manual intervention.
#
# One-time setup: run deploy/ec2/setup-autodeploy.sh (see deploy/ec2/AUTODEPLOY.md).
# It creates the IAM OIDC role + SSM instance profile and sets these three
# repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION, AWS_ROLE_ARN, EC2_INSTANCE_ID
#
# No AWS access keys and no inbound SSH from GitHub-hosted runners are needed:
# the job assumes a short-lived OIDC role and sends the deploy command over AWS
# Systems Manager Run Command.

name: Deploy to EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    # Skipped (not failed) until setup-autodeploy.sh sets the three repository
    # variables. Option A (auto-pull timer) needs no GitHub setup at all.
    if: ${{ vars.AWS_REGION != '' && vars.AWS_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Check repository variables
        run: |
          missing=0
          for v in AWS_REGION AWS_ROLE_ARN EC2_INSTANCE_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository variable $v (run deploy/ec2/setup-autodeploy.sh)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Authenticate to AWS with OIDC (no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy over SSM Run Command
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }} from GitHub Actions" \
            --parameters 'commands=["sudo /usr/local/bin/btc-hunt-update"]' \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text
                echo "deploy succeeded"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|DeliveryTimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text || true
                echo "::error::deploy failed with status $STATUS"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::SSM command did not finish within 10 minutes"
          exit 1
