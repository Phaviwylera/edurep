services:
  - type: web
    name: btc-hunt
    runtime: python
    plan: starter            # 2 GB RAM — free tier won't hold the bloom
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn btc_hunt:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1 --threads 8
    disk:
      name: data
      mountPath: /data
      sizeGB: 10             # 1.5 GB dataset + 60 MB bloom + results
    envVars:
      - key: DISK_PATH
        value: /data
      - key: ESPLORA_URL
        value: https://blockstream.info/api
      - key: PYTHON_VERSION
        value: 3.12.6